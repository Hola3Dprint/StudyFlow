name: Build and publish StudyFlow Rainbow

on:
  push:
    branches: [codex/rainbow-mode]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - id: version
        shell: pwsh
        run: '"version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: StudyFlow Rainbow v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/StudyFlow-Rainbow-Setup-*.exe
            release/*.blockmap
            release/rainbow.yml
